<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tablas</title>
    <style>
      table,
      th,
      td {
        border: 2px solid blue;
        border-collapse: collapse;
        padding: 10px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Tablas</h1>
      <hr />
    </header>

    <main>
      <section>
        <table>
          <!-- primera fila -->
          <tr>
            <th>Título 1</th>
            <th>Título 2</th>
            <th>Título 3</th>
          </tr>
          <!-- segunda fila -->
          <tr>
            <td>A</td>
            <td>B</td>
            <td>C</td>
          </tr>
          <!-- tercera fila -->
          <tr>
            <td>D</td>
            <td>E</td>
            <td>F</td>
          </tr>
        </table>
      </section>
    </main>
  </body>
</html>
